name: smartfarm

services:
  backend:
    build: ./apps/backend
    image: smartfarm-backend:latest
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      HA_BASE_URL: ${HA_BASE_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_SYNC_INTERVAL_SEC: ${HA_SYNC_INTERVAL_SEC:-300}
      HA_SYNC_ENABLED: ${HA_SYNC_ENABLED:-true}
    volumes:
      - backend-data:/app/data
    expose:
      - "3001"

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
    image: smartfarm-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"

  # Reverse proxy: /api/* → backend, selain itu → frontend. HTTPS otomatis bila SITE_ADDRESS berupa domain.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

  # Cloudflare Tunnel — hanya aktif bila CLOUDFLARE_TUNNEL_TOKEN diisi (deploy.sh menyalakan profile "tunnel").
  # Di dashboard Cloudflare, Public Hostname harus mengarah ke service HTTP: caddy:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy

volumes:
  backend-data:
  caddy-data:
  caddy-config:
